[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"


[project]
version = "500"
name = "nixt"
authors = [
    {name = "Nixt Niet", email = "nixtniet@proton.me" },
]
description = "write your own commands"
readme = "README.rst"
license = "Unlicense"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities"
]

[project.scripts]
"nixt" = "nixt.runtime:main"
"nixtd" = "nixt.daemons:main"


[project.urls]
"home" = "https://github.com/nixtniet/nixt"
"bugs" = "https://github.com/nixtniet/nixt/issues"
"source" = "https://github.com/nixtniet/nixt"


[tool.setuptools]
packages = [
    'nixt',
]


[tool.pylint."messages control"]
disable = ["C,R,W,E0401,E0402"]


[tool.ruff.lint]
ignore = ["ALL"]
